# Terminal: one image for $4000-$93ff (the overlay slot, the load buffer and the floor), unpacked in place from
# a packed copy loaded to its top end (c64/build.js). Its buffers are at $c400 (the second screen) and in
# its own BSS. Zero page $40-$7f.
MEMORY {
    ZP:  start = $0040, size = $0040, type = rw;
    TRM: start = $4000, size = $5400, file = %O;
}
SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    CODE:     load = TRM, type = ro;
    RODATA:   load = TRM, type = ro;
    TDATA:    load = TRM, type = ro;
    BSS:      load = TRM, type = bss, define = yes, optional = yes;
}
