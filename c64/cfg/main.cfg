# Resident program: part 1 at $0801 (BASIC stub, below the overlay slot at $4000), part 2 at $9400 (above
# the floor at $8000-$93ff). Part 2 is its own file, loaded by the boot file.
MEMORY {
    ZP:    start = $0014, size = $002c, type = rw;
    LOW:   start = $0200, size = $0058, type = rw;         # BASIC's input buffer: unused without BASIC
    HEAD:  start = $07ff, size = $0002, file = %O;
    MAIN:  start = $0801, size = $37ff, file = %O;
    MAIN2: start = $9500, size = $2b00, file = "build/main2.bin";
    FAR:   start = $e000, size = $1ffa, file = "build/far.bin";
}
SEGMENTS {
    ZEROPAGE: load = ZP,    type = zp, optional = yes;
    LOWBSS:   load = LOW,   type = bss, optional = yes;
    HEAD:     load = HEAD,  type = ro;
    CODE:     load = MAIN,  type = ro;
    RODATA:   load = MAIN,  type = ro;
    DATA:     load = MAIN,  type = rw;
    BSS:      load = MAIN,  type = bss, define = yes;
    CODE2:    load = MAIN2, type = ro, optional = yes;
    RODATA2:  load = MAIN2, type = ro, optional = yes;
    BSS2:     load = MAIN2, type = bss, optional = yes, define = yes;
    FAR:      load = FAR,   type = ro;
}
