# Resident program: BASIC stub at $0801, must stay below the overlay slot at $4000.
MEMORY {
    ZP:   start = $0014, size = $002c, type = rw;
    HEAD: start = $07ff, size = $0002, file = %O;
    MAIN: start = $0801, size = $37ff, file = %O;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp, optional = yes;
    HEAD:     load = HEAD, type = ro;
    CODE:     load = MAIN, type = ro;
    RODATA:   load = MAIN, type = ro;
    DATA:     load = MAIN, type = rw;
    BSS:      load = MAIN, type = bss, define = yes;
}
