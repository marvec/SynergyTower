# Mini-game overlay: raw image for $4000-$5fff (packed and loaded on demand), zero page $40-$7f.
MEMORY {
    ZP:  start = $0040, size = $0040, type = rw;
    OVL: start = $4000, size = $2000, file = %O;
}
SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    CODE:     load = OVL, type = ro;
    RODATA:   load = OVL, type = ro;
    DATA:     load = OVL, type = rw, optional = yes;
    BSS:      load = OVL, type = bss, define = yes;
}
