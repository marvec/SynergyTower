# Boot file: BASIC stub at $0801, loaded by the KERNAL. Uploads the drive code, then runs its copy of the
# fast loader at $c400 (free until the main program uses it as the second screen) to load the main program.
MEMORY {
    ZP:   start = $0014, size = $002c, type = rw;
    HEAD: start = $07ff, size = $0002, file = %O;
    MAIN: start = $0801, size = $0800, file = %O;
    HIGH: start = $c400, size = $0400;
}
SEGMENTS {
    HEAD:   load = HEAD, type = ro;
    CODE:   load = MAIN, type = ro;
    LOADER: load = MAIN, run = HIGH, type = ro, define = yes;
    BSS:    load = MAIN, type = bss;
}
